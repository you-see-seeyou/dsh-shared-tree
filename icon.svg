<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- 共享树：一棵由多个节点共享同一主干的结构。
       主干代表 profiles/node_modules，三个节点代表按名引用的 profile。
       中性配色，与相邻插件图标饱和度一致；无背景板、无滤镜。 -->
  <g fill="none" stroke="#4b5b73" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主干 -->
    <path d="M18 30.5V17.5"/>
    <!-- 分叉枝 -->
    <path d="M18 22.5C15 22.5 11.5 20.5 10.5 17"/>
    <path d="M18 22.5C21 22.5 24.5 20.5 25.5 17"/>
  </g>
  <!-- 根：共享的那一份 -->
  <rect x="14.2" y="29" width="7.6" height="5" rx="1.3" fill="#4b5b73"/>
  <!-- 三个 profile 节点 -->
  <circle cx="10.5" cy="13.6" r="3.5" fill="none" stroke="#4b5b73" stroke-width="1.8"/>
  <circle cx="25.5" cy="13.6" r="3.5" fill="none" stroke="#4b5b73" stroke-width="1.8"/>
  <circle cx="18" cy="9.4" r="3.5" fill="none" stroke="#4b5b73" stroke-width="1.8"/>
  <!-- 中心节点：被共享的包 -->
  <circle cx="18" cy="17.5" r="2.1" fill="#4b5b73"/>
</svg>